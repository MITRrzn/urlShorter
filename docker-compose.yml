services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api

    container_name: url-shortener-api

    environment:
      APP_PORT: ${APP_PORT}
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}

    ports:
      - "8081:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    restart: unless-stopped


  analytics-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: analytics-worker

    container_name: url-shortener-analytics

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/url_shortener?sslmode=disable
      KAFKA_BROKERS: kafka:9092

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    restart: unless-stopped


  postgres:
    image: postgres:17-alpine

    container_name: url-shortener-postgres

    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d url_shortener"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  redis:
    image: redis:8-alpine

    container_name: url-shortener-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  kafka:
    image: apache/kafka:4.1.0

    container_name: url-shortener-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    volumes:
      - kafka_data:/var/lib/kafka/data

    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  kafka_data: